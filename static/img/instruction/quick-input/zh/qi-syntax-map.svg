<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" width="760" height="178" role="img" aria-label="快捷输入命令语法结构">
  <rect x="1" y="1" width="758" height="176" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="20" y="25" font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif" font-size="13" fill="#64748b">一条命令由四段组成</text>

  <g font-family="ui-monospace,Consolas,'Courier New',monospace">
    <rect x="22" y="38" width="130" height="44" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="87" y="67" text-anchor="middle" font-size="19" fill="#1e40af">$时序图</text>
    <rect x="160" y="38" width="130" height="44" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="225" y="66" text-anchor="middle" font-size="16" fill="#5b21b6">:test_dog</text>
    <rect x="298" y="38" width="118" height="44" rx="7" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="357" y="66" text-anchor="middle" font-size="16" fill="#0e7490">-销售订单</text>
    <rect x="424" y="38" width="312" height="44" rx="7" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="580" y="66" text-anchor="middle" font-size="16" fill="#9a3412">{agg:sum title:销售趋势}</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="1.5">
    <path d="M87 82 L87 100"/>
    <path d="M225 82 L225 100"/>
    <path d="M357 82 L357 100"/>
    <path d="M580 82 L580 100"/>
  </g>

  <g font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="87" y="119" font-size="15" font-weight="700" fill="#1e40af">① 卡片类型</text>
    <text x="87" y="139" font-size="12.5" fill="#475569">必填 · 展示名 / id</text>

    <text x="225" y="119" font-size="15" font-weight="700" fill="#5b21b6">② 数据源</text>
    <text x="225" y="139" font-size="12.5" fill="#475569">可选 · 冒号引出</text>

    <text x="357" y="119" font-size="15" font-weight="700" fill="#0e7490">③ 指标</text>
    <text x="357" y="139" font-size="12.5" fill="#475569">可选 · 短横线连接</text>

    <text x="580" y="119" font-size="15" font-weight="700" fill="#9a3412">④ 配置段</text>
    <text x="580" y="139" font-size="12.5" fill="#475569">可选 · 空格分隔的 key:value</text>

    <text x="20" y="166" text-anchor="start" font-size="12.5" fill="#64748b">不带 $ 的纯文本不走这条语法，直接生成 Markdown 卡片；②③④ 均可省略。</text>
  </g>
</svg>
