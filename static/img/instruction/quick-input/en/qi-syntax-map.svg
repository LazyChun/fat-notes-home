<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" width="760" height="178" role="img" aria-label="Quick Input command syntax">
  <rect x="1" y="1" width="758" height="176" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="20" y="25" font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif" font-size="13" fill="#64748b">A command has four segments</text>

  <g font-family="ui-monospace,Consolas,'Courier New',monospace">
    <rect x="16" y="38" width="152" height="44" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="92" y="66" text-anchor="middle" font-size="17" fill="#1e40af">$Time Series</text>
    <rect x="176" y="38" width="126" height="44" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="239" y="66" text-anchor="middle" font-size="16" fill="#5b21b6">:test_dog</text>
    <rect x="310" y="38" width="118" height="44" rx="7" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="369" y="66" text-anchor="middle" font-size="16" fill="#0e7490">-销售订单</text>
    <rect x="436" y="38" width="306" height="44" rx="7" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="589" y="66" text-anchor="middle" font-size="15" fill="#9a3412">{agg:sum title:SalesTrend}</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="1.5">
    <path d="M92 82 L92 100"/>
    <path d="M239 82 L239 100"/>
    <path d="M369 82 L369 100"/>
    <path d="M589 82 L589 100"/>
  </g>

  <g font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="92" y="119" font-size="15" font-weight="700" fill="#1e40af">1. Widget type</text>
    <text x="92" y="139" font-size="12.5" fill="#475569">Required · name / id</text>

    <text x="239" y="119" font-size="15" font-weight="700" fill="#5b21b6">2. Data source</text>
    <text x="239" y="139" font-size="12.5" fill="#475569">Optional · after :</text>

    <text x="369" y="119" font-size="15" font-weight="700" fill="#0e7490">3. Metric</text>
    <text x="369" y="139" font-size="12.5" fill="#475569">Optional · after -</text>

    <text x="589" y="119" font-size="15" font-weight="700" fill="#9a3412">4. Options</text>
    <text x="589" y="139" font-size="12.5" fill="#475569">Optional · space-separated key:value</text>

    <text x="20" y="166" text-anchor="start" font-size="12.5" fill="#64748b">Plain text without $ skips this syntax and becomes a Markdown card; segments 2-4 are optional.</text>
  </g>
</svg>
