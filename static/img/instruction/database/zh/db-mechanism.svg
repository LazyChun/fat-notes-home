<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">数据库模块的数据链路</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">「数据库管理器」把本地物理库注册为数据源，组织成库→表→列的结构，行是真实数据，最终被看板、功能与流程消费。</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g>
    <rect x="24" y="88" width="168" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="114" font-size="13" font-weight="700" fill="#1d4ed8">① 建库</text>
    <text x="38" y="138" font-size="12" fill="#334155">点「添加数据库」</text>
    <text x="38" y="158" font-size="12" fill="#334155">类型：默认（本地）</text>
    <text x="38" y="178" font-size="12" fill="#334155">生成 SQLite 文件</text>
    <text x="38" y="194" font-size="11" fill="#64748b">写入 dbs/items.json</text>
  </g>
  <line x1="194" y1="144" x2="218" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="222" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="236" y="114" font-size="13" font-weight="700" fill="#0f172a">② 注册</text>
    <text x="236" y="138" font-size="12" fill="#334155">登记为数据源</text>
    <text x="236" y="158" font-size="12" fill="#334155">databaseSources.json</text>
    <text x="236" y="178" font-size="12" fill="#334155">记录库/表/列</text>
    <text x="236" y="194" font-size="11" fill="#64748b">出现在管理器树</text>
  </g>
  <line x1="392" y1="144" x2="416" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="420" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="434" y="114" font-size="13" font-weight="700" fill="#0f172a">③ 结构</text>
    <text x="434" y="138" font-size="12" fill="#334155">库 → 表 → 列</text>
    <text x="434" y="158" font-size="12" fill="#334155">左侧树逐级展开</text>
    <text x="434" y="178" font-size="12" fill="#334155">列名与字段类型</text>
    <text x="434" y="194" font-size="11" fill="#64748b">支持多表多库</text>
  </g>
  <line x1="590" y1="144" x2="614" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="618" y="88" width="168" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="632" y="114" font-size="13" font-weight="700" fill="#c2410c">④ 读写</text>
    <text x="632" y="138" font-size="12" fill="#334155">表内行数据</text>
    <text x="632" y="158" font-size="12" fill="#334155">添加行 / 删除</text>
    <text x="632" y="178" font-size="12" fill="#334155">筛选 ID=、排序</text>
    <text x="632" y="194" font-size="11" fill="#64748b">分页「共 N 条」</text>
  </g>
  <line x1="788" y1="144" x2="812" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="816" y="88" width="140" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="830" y="114" font-size="13" font-weight="700" fill="#15803d">⑤ 消费</text>
    <text x="830" y="138" font-size="12" fill="#334155">看板查数</text>
    <text x="830" y="158" font-size="12" fill="#334155">功能页回填</text>
    <text x="830" y="178" font-size="12" fill="#334155">流程 ETL</text>
    <text x="830" y="194" font-size="11" fill="#64748b">表格类组件</text>
  </g>
  <rect x="24" y="222" width="932" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#b91c1c">容易踩的坑</text>
  <text x="40" y="264" font-size="12" fill="#7f1d1d">物理库位于工作区 dbs/sqlite3_dbs/ 下，结构与数据改动直接落盘；演示/重要数据操作前先备份；管理器以浏览与轻量编辑为主，结构调整走「添加数据库/表」。</text>
</svg>
