<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">Data flow of the Database module</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">The Database Manager registers local physical databases as data sources, organizes them into database → table → column, where rows are the real data, finally consumed by dashboards, functions and flows.</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g>
    <rect x="24" y="88" width="168" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="114" font-size="13" font-weight="700" fill="#1d4ed8">1 Create</text>
    <text x="38" y="138" font-size="12" fill="#334155">Click "Add database"</text>
    <text x="38" y="158" font-size="12" fill="#334155">Type: Default (local)</text>
    <text x="38" y="178" font-size="12" fill="#334155">Generates SQLite file</text>
    <text x="38" y="194" font-size="11" fill="#64748b">Writes dbs/items.json</text>
  </g>
  <line x1="194" y1="144" x2="218" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="222" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="236" y="114" font-size="13" font-weight="700" fill="#0f172a">2 Register</text>
    <text x="236" y="138" font-size="12" fill="#334155">Register as source</text>
    <text x="236" y="158" font-size="12" fill="#334155">databaseSources.json</text>
    <text x="236" y="178" font-size="12" fill="#334155">Records db/table/col</text>
    <text x="236" y="194" font-size="11" fill="#64748b">Shown in the tree</text>
  </g>
  <line x1="392" y1="144" x2="416" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="420" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="434" y="114" font-size="13" font-weight="700" fill="#0f172a">3 Structure</text>
    <text x="434" y="138" font-size="12" fill="#334155">db → table → column</text>
    <text x="434" y="158" font-size="12" fill="#334155">Tree expands by level</text>
    <text x="434" y="178" font-size="12" fill="#334155">Column name &amp; type</text>
    <text x="434" y="194" font-size="11" fill="#64748b">Many tables &amp; dbs</text>
  </g>
  <line x1="590" y1="144" x2="614" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="618" y="88" width="168" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="632" y="114" font-size="13" font-weight="700" fill="#c2410c">4 Read/Write</text>
    <text x="632" y="138" font-size="12" fill="#334155">Rows per table</text>
    <text x="632" y="158" font-size="12" fill="#334155">Add row / Delete</text>
    <text x="632" y="178" font-size="12" fill="#334155">Filter ID=, sort</text>
    <text x="632" y="194" font-size="11" fill="#64748b">Pager "N records"</text>
  </g>
  <line x1="788" y1="144" x2="812" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="816" y="88" width="140" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="830" y="114" font-size="13" font-weight="700" fill="#15803d">5 Consume</text>
    <text x="830" y="138" font-size="12" fill="#334155">Dashboards</text>
    <text x="830" y="158" font-size="12" fill="#334155">Function fill</text>
    <text x="830" y="178" font-size="12" fill="#334155">Flow ETL</text>
    <text x="830" y="194" font-size="11" fill="#64748b">Table blocks</text>
  </g>
  <rect x="24" y="222" width="932" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#b91c1c">Watch out</text>
  <text x="40" y="264" font-size="12" fill="#7f1d1d">Physical databases live under workspace dbs/sqlite3_dbs/ and changes persist to disk; back up before editing demo or important data. The manager is mainly for browsing and light editing; structural changes go through "Add database / table".</text>
</svg>
