<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">How a scheduled task fires</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">A rule is only a timetable: an active scheduled run hands the board over to the background scheduler</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g>
    <rect x="24" y="88" width="168" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="114" font-size="13" font-weight="700" fill="#1d4ed8">1. Save a rule</text>
    <text x="38" y="138" font-size="12" fill="#334155">Name / Cron expression</text>
    <text x="38" y="158" font-size="12" fill="#334155">Board binding + Enabled</text>
    <text x="38" y="182" font-size="11" fill="#64748b">Schedule Rules list</text>
  </g>
  <line x1="194" y1="144" x2="218" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="222" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="236" y="114" font-size="13" font-weight="700" fill="#0f172a">2. Activate board</text>
    <text x="236" y="138" font-size="12" fill="#334155">Tab bar Play dropdown</text>
    <text x="236" y="158" font-size="12" fill="#334155">Pick a schedule rule</text>
    <text x="236" y="182" font-size="11" fill="#64748b">Creates a scheduled record</text>
  </g>
  <line x1="392" y1="144" x2="416" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="420" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="434" y="114" font-size="13" font-weight="700" fill="#0f172a">3. Background poll</text>
    <text x="434" y="138" font-size="12" fill="#334155">Checks every 30 seconds</text>
    <text x="434" y="158" font-size="12" fill="#334155">Cron matches this minute</text>
    <text x="434" y="182" font-size="11" fill="#64748b">Local time, minute precision</text>
  </g>
  <line x1="590" y1="144" x2="614" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="618" y="88" width="168" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="632" y="114" font-size="13" font-weight="700" fill="#c2410c">4. Run workflows</text>
    <text x="632" y="138" font-size="12" fill="#334155">All flow cards on board</text>
    <text x="632" y="158" font-size="12" fill="#334155">Think / Screen / ETL DAG</text>
    <text x="632" y="182" font-size="11" fill="#64748b">Progress over WebSocket</text>
  </g>
  <line x1="788" y1="144" x2="812" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="816" y="88" width="140" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="830" y="114" font-size="13" font-weight="700" fill="#15803d">5. Trace</text>
    <text x="830" y="138" font-size="12" fill="#334155">Executions +1</text>
    <text x="830" y="158" font-size="12" fill="#334155">Run records kept</text>
    <text x="830" y="182" font-size="11" fill="#64748b">Running / Completed</text>
  </g>
  <rect x="24" y="222" width="932" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#b91c1c">How to pause</text>
  <text x="40" y="264" font-size="12" fill="#7f1d1d">Turn off Enabled, or cancel the scheduled run in the Run panel. Exiting the app stops triggers; missed runs are not replayed.</text>
</svg>
