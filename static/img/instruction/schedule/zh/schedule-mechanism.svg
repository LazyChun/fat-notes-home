<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">定时任务的触发链路</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">规则只是「时间表」，还需要一条运行中的定时记录把面板交给后台调度器</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g>
    <rect x="24" y="88" width="168" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="114" font-size="13" font-weight="700" fill="#1d4ed8">① 保存规则</text>
    <text x="38" y="138" font-size="12" fill="#334155">名称 / Cron 表达式</text>
    <text x="38" y="158" font-size="12" fill="#334155">绑定面板 + 启用</text>
    <text x="38" y="182" font-size="11" fill="#64748b">定时运行规则列表</text>
  </g>
  <line x1="194" y1="144" x2="218" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="222" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="236" y="114" font-size="13" font-weight="700" fill="#0f172a">② 激活面板</text>
    <text x="236" y="138" font-size="12" fill="#334155">标签栏 ▶ 下拉</text>
    <text x="236" y="158" font-size="12" fill="#334155">点选一条定时规则</text>
    <text x="236" y="182" font-size="11" fill="#64748b">生成「定时」运行记录</text>
  </g>
  <line x1="392" y1="144" x2="416" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="420" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="434" y="114" font-size="13" font-weight="700" fill="#0f172a">③ 后台轮询</text>
    <text x="434" y="138" font-size="12" fill="#334155">每 30 秒检查一次</text>
    <text x="434" y="158" font-size="12" fill="#334155">Cron 命中当前分钟</text>
    <text x="434" y="182" font-size="11" fill="#64748b">按本机时间、分钟级</text>
  </g>
  <line x1="590" y1="144" x2="614" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="618" y="88" width="168" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="632" y="114" font-size="13" font-weight="700" fill="#c2410c">④ 执行工作流</text>
    <text x="632" y="138" font-size="12" fill="#334155">面板内所有工作流卡片</text>
    <text x="632" y="158" font-size="12" fill="#334155">思维 / 屏幕 / ETL DAG</text>
    <text x="632" y="182" font-size="11" fill="#64748b">进度经 WebSocket 回传</text>
  </g>
  <line x1="788" y1="144" x2="812" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="816" y="88" width="140" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="830" y="114" font-size="13" font-weight="700" fill="#15803d">⑤ 留痕</text>
    <text x="830" y="138" font-size="12" fill="#334155">执行次数 +1</text>
    <text x="830" y="158" font-size="12" fill="#334155">运行记录可查</text>
    <text x="830" y="182" font-size="11" fill="#64748b">正在运行 / 已完成</text>
  </g>
  <rect x="24" y="222" width="932" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#b91c1c">暂停方式</text>
  <text x="40" y="264" font-size="12" fill="#7f1d1d">关闭「启用」开关，或在运行面板取消这条定时运行记录；应用退出后不再触发，也不会补跑错过的次数。</text>
</svg>
