<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="980" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">The structure of the Extension Center: FatHub marketplace + your custom extensions</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">The Extension Center is the single place to collect, browse and install extensions in FatNotes: get them from the community on the left, or build your own on the right — both are eventually consumed by functions, flows and the AI.</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- center node -->
  <rect x="395" y="78" width="190" height="46" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="490" y="100" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle">Extension Center</text>
  <text x="490" y="118" font-size="11" fill="#6366f1" text-anchor="middle">One entry, one manager</text>
  <line x1="430" y1="124" x2="270" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="550" y1="124" x2="710" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- left: FatHub marketplace -->
  <rect x="40" y="162" width="420" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="188" font-size="14" font-weight="700" fill="#1d4ed8">FatHub Marketplace</text>
  <text x="56" y="206" font-size="11" fill="#64748b">Browse, search and install from the community</text>
  <g>
    <rect x="56" y="222" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="102" y="242" font-size="11" fill="#1e40af" text-anchor="middle">Plugins</text>
    <rect x="156" y="222" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="202" y="242" font-size="11" fill="#1e40af" text-anchor="middle">Functions</text>
    <rect x="256" y="222" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="302" y="242" font-size="11" fill="#1e40af" text-anchor="middle">Workflows</text>
    <rect x="356" y="222" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="402" y="242" font-size="11" fill="#1e40af" text-anchor="middle">Adv. Plugins</text>
    <rect x="56" y="262" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="102" y="282" font-size="11" fill="#1e40af" text-anchor="middle">Skills</text>
    <rect x="156" y="262" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="202" y="282" font-size="11" fill="#1e40af" text-anchor="middle">MCP Tools</text>
    <rect x="256" y="262" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="302" y="282" font-size="11" fill="#1e40af" text-anchor="middle">MCP Servers</text>
    <rect x="356" y="262" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="402" y="282" font-size="11" fill="#1e40af" text-anchor="middle">Collections</text>
  </g>
  <!-- right: my / custom extensions -->
  <rect x="500" y="162" width="440" height="200" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="516" y="188" font-size="14" font-weight="700" fill="#15803d">My / Custom Extensions</text>
  <text x="516" y="206" font-size="11" fill="#64748b">Create and manage your own</text>
  <g>
    <rect x="516" y="222" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="616" y="241" font-size="11" fill="#166534" text-anchor="middle">My Functions</text>
    <rect x="736" y="222" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="836" y="241" font-size="11" fill="#166534" text-anchor="middle">My Workflows</text>
    <rect x="516" y="258" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="616" y="277" font-size="11" fill="#166534" text-anchor="middle">Custom Plugins</text>
    <rect x="736" y="258" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="836" y="277" font-size="11" fill="#166534" text-anchor="middle">Custom Skills</text>
    <rect x="516" y="294" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="616" y="313" font-size="11" fill="#166534" text-anchor="middle">Custom MCP Tool</text>
    <rect x="736" y="294" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="836" y="313" font-size="11" fill="#166534" text-anchor="middle">Custom MCP Server</text>
    <rect x="516" y="330" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="616" y="349" font-size="11" fill="#166534" text-anchor="middle">Custom Adv. Plugins</text>
    <rect x="736" y="330" width="200" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="836" y="349" font-size="11" fill="#166534" text-anchor="middle">Custom Collections</text>
  </g>
  <!-- bottom note -->
  <rect x="40" y="382" width="900" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="409" font-size="12" fill="#7f1d1d">Extensions are consumed by Functions, Flow Automation and the AI chat: functions and workflows open as ready-to-use apps; Skills and MCP extend AI capabilities; plugins and advanced plugins enhance the UI and data processing.</text>
</svg>
