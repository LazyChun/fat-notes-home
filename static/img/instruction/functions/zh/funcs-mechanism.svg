<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">功能的生成与使用链路</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">一个功能 = 由「功能面板」块构建出的只读小应用，源面板改动后要重新构建才会同步</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g>
    <rect x="24" y="88" width="168" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="114" font-size="13" font-weight="700" fill="#1d4ed8">① 搭面板</text>
    <text x="38" y="138" font-size="12" fill="#334155">组件面板 → 窗口</text>
    <text x="38" y="158" font-size="12" fill="#334155">放功能面板块</text>
    <text x="38" y="178" font-size="12" fill="#334155">拖入输入框等子块</text>
    <text x="38" y="194" font-size="11" fill="#64748b">配名称 / Logo / 标签</text>
  </g>
  <line x1="194" y1="144" x2="218" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="222" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="236" y="114" font-size="13" font-weight="700" fill="#0f172a">② 构建</text>
    <text x="236" y="138" font-size="12" fill="#334155">点块上「构建」</text>
    <text x="236" y="158" font-size="12" fill="#334155">校验 ID 与源面板</text>
    <text x="236" y="178" font-size="12" fill="#334155">写索引、复制面板</text>
    <text x="236" y="194" font-size="11" fill="#64748b">可选导出 func 扩展包</text>
  </g>
  <line x1="392" y1="144" x2="416" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="420" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="434" y="114" font-size="13" font-weight="700" fill="#0f172a">③ 登记</text>
    <text x="434" y="138" font-size="12" fill="#334155">funcs/funcs.json</text>
    <text x="434" y="158" font-size="12" fill="#334155">funcs/&lt;id&gt;/boards/</text>
    <text x="434" y="178" font-size="12" fill="#334155">funcs/&lt;id&gt;/icons/</text>
    <text x="434" y="194" font-size="11" fill="#64748b">按最后更新时间倒序</text>
  </g>
  <line x1="590" y1="144" x2="614" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="618" y="88" width="168" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="632" y="114" font-size="13" font-weight="700" fill="#c2410c">④ 使用</text>
    <text x="632" y="138" font-size="12" fill="#334155">功能列表搜索 / 标签</text>
    <text x="632" y="158" font-size="12" fill="#334155">单击开页签，双击新开</text>
    <text x="632" y="178" font-size="12" fill="#334155">功能页只读渲染</text>
    <text x="632" y="194" font-size="11" fill="#64748b">块内交互仍可用</text>
  </g>
  <line x1="788" y1="144" x2="812" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="816" y="88" width="140" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="830" y="114" font-size="13" font-weight="700" fill="#15803d">⑤ 直达</text>
    <text x="830" y="138" font-size="12" fill="#334155">查询匹配绑正则</text>
    <text x="830" y="158" font-size="12" fill="#334155">Ctrl+K 命中</text>
    <text x="830" y="178" font-size="12" fill="#334155">打开源面板</text>
    <text x="830" y="194" font-size="11" fill="#64748b">回填输入框</text>
  </g>
  <rect x="24" y="222" width="932" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#b91c1c">容易踩的坑</text>
  <text x="40" y="264" font-size="12" fill="#7f1d1d">功能页是构建时的快照；功能列表初始为空，没有内置功能或默认分组，条目都来自「构建」或 func 扩展包。</text>
</svg>
