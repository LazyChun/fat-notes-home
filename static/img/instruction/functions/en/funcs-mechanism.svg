<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">How a function is built and used</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">A function is a read-only mini-app built from a Function Panel block; rebuild after changing the source board</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g>
    <rect x="24" y="88" width="168" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="114" font-size="13" font-weight="700" fill="#1d4ed8">1. Build a panel</text>
    <text x="38" y="138" font-size="11" fill="#334155">Components &gt; Window</text>
    <text x="38" y="158" font-size="11" fill="#334155">Add a Function Panel</text>
    <text x="38" y="178" font-size="11" fill="#334155">Drop inputs, text, charts</text>
    <text x="38" y="194" font-size="11" fill="#64748b">Set name / logo / tags</text>
  </g>
  <line x1="194" y1="144" x2="218" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="222" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="236" y="114" font-size="13" font-weight="700" fill="#0f172a">2. Build</text>
    <text x="236" y="138" font-size="11" fill="#334155">Click Build on the block</text>
    <text x="236" y="158" font-size="11" fill="#334155">Validate ID and board</text>
    <text x="236" y="178" font-size="11" fill="#334155">Write index, copy board</text>
    <text x="236" y="194" font-size="11" fill="#64748b">Optionally export a func</text>
  </g>
  <line x1="392" y1="144" x2="416" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="420" y="88" width="168" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="434" y="114" font-size="13" font-weight="700" fill="#0f172a">3. Register</text>
    <text x="434" y="138" font-size="11" fill="#334155">funcs/funcs.json</text>
    <text x="434" y="158" font-size="11" fill="#334155">funcs/&lt;id&gt;/boards/</text>
    <text x="434" y="178" font-size="11" fill="#334155">funcs/&lt;id&gt;/icons/</text>
    <text x="434" y="194" font-size="11" fill="#64748b">Sorted by last update</text>
  </g>
  <line x1="590" y1="144" x2="614" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="618" y="88" width="168" height="112" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="632" y="114" font-size="13" font-weight="700" fill="#c2410c">4. Use</text>
    <text x="632" y="138" font-size="11" fill="#334155">Search / tag filter</text>
    <text x="632" y="158" font-size="11" fill="#334155">Click or double-click</text>
    <text x="632" y="178" font-size="11" fill="#334155">Read-only function page</text>
    <text x="632" y="194" font-size="11" fill="#64748b">Inner widgets stay live</text>
  </g>
  <line x1="788" y1="144" x2="812" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="816" y="88" width="140" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="830" y="114" font-size="13" font-weight="700" fill="#15803d">5. Jump in</text>
    <text x="830" y="138" font-size="11" fill="#334155">Bind a search regex</text>
    <text x="830" y="158" font-size="11" fill="#334155">Ctrl+K matches</text>
    <text x="830" y="178" font-size="11" fill="#334155">Open the source board</text>
    <text x="830" y="194" font-size="11" fill="#64748b">Fill the input</text>
  </g>
  <rect x="24" y="222" width="932" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="244" font-size="12" font-weight="700" fill="#b91c1c">Common pitfall</text>
  <text x="40" y="264" font-size="12" fill="#7f1d1d">A function page is a snapshot. The list starts empty - there are no built-in functions or default groups; items come from Build or func packages.</text>
</svg>
